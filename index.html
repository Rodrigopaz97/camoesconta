<style>
@font-face{font-family:"IM Fell English";font-style:normal;font-weight:400;font-display:swap;src:url(assets/fonts/IMFellEnglish-normal-400.woff2) format("woff2")}
@font-face{font-family:"IM Fell English";font-style:italic;font-weight:400;font-display:swap;src:url(assets/fonts/IMFellEnglish-italic-400.woff2) format("woff2")}
@font-face{font-family:"Crimson Pro";font-style:normal;font-weight:400;font-display:swap;src:url(assets/fonts/CrimsonPro-normal-400.woff2) format("woff2")}
@font-face{font-family:"Crimson Pro";font-style:italic;font-weight:400;font-display:swap;src:url(assets/fonts/CrimsonPro-italic-400.woff2) format("woff2")}
@font-face{font-family:"Crimson Pro";font-style:normal;font-weight:600;font-display:swap;src:url(assets/fonts/CrimsonPro-normal-600.woff2) format("woff2")}
/* v2 "livro de lendas": tinta, papel e ouro liso. Sem degradés, brilhos, partículas nem cartões iguais. */
:root{
  --tinta:#0b2230; --tinta2:#10303f; --regua:#2a5368;
  --papel:#eadfc2; --papel-tinta:#12303d; --cobre:#8b5a2b;
  --ouro:#d6ab4f; --ouro-esc:#b88a32;
  --texto:#e9e2cf; --suave:#a7bac3;
  --serif-d:"IM Fell English","Iowan Old Style",Georgia,serif;
  --serif:"Crimson Pro","Iowan Old Style",Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--tinta);color:var(--texto);font-family:var(--serif);font-size:19px;line-height:1.6;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
a{color:var(--ouro)}
a:focus-visible,button:focus-visible{outline:2px solid var(--ouro);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3{font-family:var(--serif-d);font-weight:400;line-height:1.08;margin:0;text-wrap:balance;color:var(--texto)}
button{font-family:inherit}
[hidden]{display:none!important}

/* topo */
nav{display:flex;gap:16px 28px;flex-wrap:wrap;padding:22px 0;align-items:center;justify-content:space-between}
nav .brand{display:inline-flex;align-items:center;gap:12px;font-family:var(--serif-d);font-size:25px;color:var(--texto);text-decoration:none}
.bm{height:42px;width:auto;display:block}
.navr{display:flex;gap:6px 26px;flex-wrap:wrap;align-items:center}
nav a.l{color:var(--suave);text-decoration:none;font-size:18px}
nav a.l:hover{color:var(--texto);text-decoration:underline;text-underline-offset:5px}
.lang{display:flex;gap:2px;font-size:17px}
.lbtn{all:unset;box-sizing:border-box;cursor:pointer;padding:2px 7px;color:var(--suave);border-bottom:2px solid transparent}
.lbtn:hover{color:var(--texto)}
.lbtn[aria-pressed="true"]{color:var(--ouro);border-bottom-color:var(--ouro)}
.lbtn:focus-visible{outline:2px solid var(--ouro);outline-offset:2px}

/* abertura */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:40px 72px;align-items:end;padding:36px 0 88px}
.hero h1{font-size:clamp(46px,7.4vw,92px);line-height:1.02;margin:0 0 26px;max-width:11.5em}
.hero p{max-width:34em;margin:0 0 30px;color:var(--texto);font-size:21px;line-height:1.55}
.hnote{margin:18px 0 0;font-size:16px;color:var(--suave)}
.plate{margin:0;justify-self:end;width:100%;max-width:340px}
.portrait{aspect-ratio:9/13;border-radius:170px 170px 0 0;overflow:hidden;border:1px solid var(--ouro)}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;display:block}
.plate figcaption{margin-top:12px;font-style:italic;font-size:16px;color:var(--suave);text-align:left;border-top:1px solid var(--regua);padding-top:8px}

/* botões */
.btn{display:inline-block;background:var(--ouro);color:#1a1405;font-weight:600;font-size:18px;padding:11px 22px;border-radius:2px;text-decoration:none;border:1px solid var(--ouro)}
.btn:hover{background:#e4bd69}
.btn.ghost{background:transparent;color:var(--ouro);border-color:var(--ouro-esc);margin-left:8px}
.btn.ghost:hover{background:rgba(214,171,79,.12)}

/* secções: título à esquerda, conteúdo à direita */
section{display:grid;grid-template-columns:minmax(0,290px) minmax(0,1fr);gap:20px 64px;padding:76px 0;border-top:1px solid var(--regua)}
.shead h2{font-size:clamp(34px,4.4vw,48px);margin:0 0 14px}
.lede{color:var(--suave);margin:0;font-size:18px;max-width:30em}
.sbody{min-width:0}
.sub3{font-family:var(--serif-d);font-size:28px;margin:54px 0 4px;font-weight:400}

/* índice de episódios */
.eps{display:block;border-top:1px solid var(--regua)}
.ep{display:grid;grid-template-columns:48px 68px minmax(0,1fr);gap:0 20px;align-items:start;padding:22px 0;border-bottom:1px solid var(--regua);cursor:pointer}
.ep .num,.upc .num{font-family:var(--serif-d);font-style:italic;font-size:30px;line-height:1.1;color:var(--ouro)}
.ep img{width:68px;aspect-ratio:9/16;object-fit:cover;display:block;border:1px solid var(--ouro-esc)}
.ep .body{min-width:0}
.row1{display:flex;align-items:baseline;gap:0}
.ep h3{font-size:clamp(24px,3vw,32px)}
.cl{color:inherit;text-decoration:none}
.ep:hover h3 .cl{color:var(--ouro)}
.lead{flex:1 1 24px;min-width:24px;border-bottom:2px dotted var(--regua);margin:0 12px;transform:translateY(-5px)}
.where{font-style:italic;color:var(--suave);font-size:18px;white-space:nowrap}
.ep.is-next .where{color:var(--ouro)}
.ep p{margin:6px 0 8px;color:var(--texto);font-size:19px;max-width:34em}
.more{font-size:17px;text-decoration:underline;text-underline-offset:4px}
.ep.is-next img{filter:grayscale(.55) brightness(.85)}
.upgrid{display:block;border-top:1px solid var(--regua)}
.upc{display:flex;align-items:baseline;gap:0;padding:16px 0;border-bottom:1px solid var(--regua);text-decoration:none;color:var(--suave)}
.upc .num{width:68px;flex:none}
.upc b{font-family:var(--serif-d);font-weight:400;font-size:24px;color:var(--texto)}
.upc small{font-style:italic;font-size:17px;white-space:nowrap}
.upc:hover b{color:var(--ouro)}

/* mapa: carta em papel */
.fsep{width:1px;background:var(--regua)}
.mapgrid{display:grid;grid-template-columns:minmax(0,310px) minmax(0,1fr);gap:36px;align-items:start}
.mapcol{display:grid;gap:18px;min-width:0}
.land{fill:rgba(18,48,61,.07);stroke:var(--papel-tinta);stroke-width:1.5;stroke-linejoin:round}
@keyframes pulse{0%{r:6;opacity:.9}100%{r:20;opacity:0}}
.leader{stroke:var(--cobre);stroke-width:.9;opacity:.8}
.tag{font-style:italic;font-size:17px;color:var(--ouro)}
.tag.soon{color:var(--suave)}
.scroll{max-height:470px;overflow-y:auto;scrollbar-color:var(--ouro-esc) transparent;scrollbar-width:thin}
.note{font-size:16px;color:var(--suave);margin:14px 0 0;max-width:34em}

/* fontes */
.fontes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:26px 32px}
.fontes div{border-top:1px solid var(--ouro-esc);padding-top:12px}
.fontes h3{font-size:24px;margin-bottom:6px}
.fontes p{margin:0;color:var(--texto);font-size:18px}
.rules{margin:34px 0 0;padding-left:20px;color:var(--suave);max-width:36em;font-size:18px}
.rules li{margin-bottom:8px}
footer{border-top:1px solid var(--regua);padding:34px 0 52px;color:var(--suave);font-size:17px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer .q{font-family:var(--serif-d);font-style:italic;color:var(--ouro);font-size:22px}

/* página de episódio */
#ep{padding:12px 0 64px}
.back{display:inline-block;margin:8px 0 22px;color:var(--suave);text-decoration:none;font-size:18px}.back:hover{color:var(--ouro)}
.ehero{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:56px;align-items:center;padding:20px 0 56px}
.ehero h1{font-size:clamp(40px,6vw,70px);margin:8px 0 16px}
.ehero .sub{color:var(--texto);font-size:22px;max-width:30em;margin:0 0 22px;line-height:1.5}
.eyebrow{font-style:italic;font-size:19px;color:var(--ouro)}
.chips{display:flex;flex-wrap:wrap;gap:0 6px;margin:0 0 26px;font-style:italic;color:var(--suave);font-size:18px}
.chip:not(:last-child)::after{content:","}
.herobtns{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px}
.herobtns .btn.ghost{margin-left:0}
.cover{position:relative;width:100%;max-width:320px;justify-self:center;transform:rotate(-5deg)}
.cover::before{content:"";position:absolute;inset:0;border:1px solid var(--ouro-esc);transform:rotate(8deg) translate(10px,6px)}

      if(ended)pb.innerHTML="&#8635; "+T("btn_again");
      clearTimeout(t2);t2=setTimeout(function(){back.innerHTML=""},950);
    }
    pb.addEventListener("click",function(){
      clearTimeout(t2);stopListen();
      var org=/^https?:/.test(location.protocol)?"&origin="+encodeURIComponent(location.origin):"";
      back.innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+c.getAttribute("data-vid")+'?autoplay=1&rel=0&playsinline=1&enablejsapi=1'+org+'&hl='+(document.documentElement.lang||"pt").slice(0,2)+'" title="'+c.getAttribute("data-title")+'" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>';
      var fr=back.firstChild,n=0;
      function ask(){try{fr.contentWindow.postMessage(JSON.stringify({event:"listening",id:1,channel:"widget"}),"*")}catch(x){}if(++n>20)clearInterval(iv)}
      iv=setInterval(ask,500);
      onMsg=function(ev){
        if(!fr.contentWindow||ev.source!==fr.contentWindow)return;
        var d=ev.data;try{if(typeof d==="string")d=JSON.parse(d)}catch(x){return}
        if(!d)return;clearInterval(iv);
        var st=d.event==="onStateChange"?d.info:(d.event==="infoDelivery"&&d.info?d.info.playerState:null);
        if(st===0)toCover(true);
      };
      addEventListener("message",onMsg);
      back.setAttribute("aria-hidden","false");c.classList.add("on");
    });
    c.querySelector(".backbtn").addEventListener("click",function(){toCover(false)});
  }
  function pageOut(e){
    var x=tx(e),l=link(e),h='<a class="back" href="#">'+T("back")+'</a><div class="ehero">'+coverHTML(e,x)+'<div><span class="eyebrow">'+T("tag_ep",{n:e.n})+'</span><h1>'+x.t+'</h1><p class="sub">'+x.sub+'</p><div class="chips">'+x.chips.map(function(c){return '<span class="chip">'+c+'</span>'}).join("")+'</div><div class="herobtns"><a class="btn" href="'+l+'" target="_blank" rel="noopener">'+T("btn_yt")+'</a><a class="btn ghost" href="'+CH+'?sub_confirmation=1" target="_blank" rel="noopener">'+T("subscribe")+'</a></div></div></div><div class="art">';
    x.s.forEach(function(s){h+='<section><h2>'+s[0]+'</h2>'+s[1]+'</section>'});
    h+='<section><h2>'+T("q_h")+'</h2><div class="callout"><p>'+x.q2+'</p></div></section>';
    h+='<section><h2>'+T("s_h")+'</h2><ul>'+x.src.map(function(s){return '<li>'+s+'</li>'}).join("")+'</ul></section>';
    h+='<div class="cta"><h2>'+T("cta_h")+'</h2><p>'+T("cta_p")+'</p><a class="btn" href="'+l+'" target="_blank" rel="noopener">'+T("cta_btn")+'</a></div>';
    var o=EPS.filter(function(y){return y.id!==e.id&&out(y)})[0];
    h+='<div class="nextep"><a href="#">'+T("back")+'</a>'+(o?'<a href="#'+o.id+'">'+T("tag_ep",{n:o.n})+': '+tx(o).t+'</a>':'')+'</div></div>';
    return h;
  }
  function pageSoon(e){
    var x=tx(e),cover=COV[e.id]?'<div class="cover"><img alt="'+T("cover_alt",{n:e.n,t:x.t})+'" src="'+COV[e.id]+'"></div>':'<div class="cover"><div class="sealcard"><span class="k">'+T("tag_ep",{n:""}).trim()+'</span><span class="nn">'+e.n+'</span><span class="s">'+T("tag_soon")+'</span></div></div>';
    var h='<a class="back" href="#">'+T("back")+'</a><div class="ehero">'+cover+'<div><span class="eyebrow">'+T("soon_eyebrow",{n:e.n})+'</span><h1>'+x.t+'</h1><p class="sub">'+x.teaser+'</p><p class="datebig">'+T("premiere")+' <em>'+when(e)+'</em> '+T("pt_time")+'</p><div class="count" id="count"></div><a class="btn" href="'+CH+'?sub_confirmation=1" target="_blank" rel="noopener">'+T("subscribe")+'</a></div></div>';
    h+='<div class="art"><section><h2>'+T("soon_h")+'</h2><p>'+T("soon_p1")+'</p><p>'+T("soon_p2")+'</p></section>';
    var o=EPS.filter(function(y){return out(y)})[0];
    h+='<div class="nextep"><a href="#">'+T("back")+'</a>'+(o?'<a href="#'+o.id+'">'+T("tag_ep",{n:o.n})+': '+tx(o).t+'</a>':'')+'</div></div>';
    return h;
  }
  function tick(e){
    var el=document.getElementById("count");if(!el)return;
    var ms=Date.parse(e.date)-Date.now();
    if(ms<=0){clearInterval(timer);route();return}
    var d=Math.floor(ms/864e5),hh=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4),s=Math.floor(ms%6e4/1e3);
    el.innerHTML='<div><b>'+d+'</b><span>'+T("d_days")+'</span></div><div><b>'+hh+'</b><span>'+T("d_hours")+'</span></div><div><b>'+m+'</b><span>'+T("d_min")+'</span></div><div><b>'+s+'</b><span>'+T("d_sec")+'</span></div>';
  }
  function route(keepScroll){
    clearInterval(timer);
    var id=location.hash.slice(1),e=BY[id];
    home();
    var vgEl=document.getElementById("viagem"),hasVg=document.documentElement.classList.contains("vg"),isV=(id==="viagem"||id==="vgfim")&&hasVg;
    if((id==="viagem"||id==="vgfim")&&!hasVg){location.replace("#");return;}
    if(vgEl){vgEl.hidden=!isV;document.body.classList.toggle("viagem-on",isV);}
    if(isV){
      view.hidden=true;homeEl.hidden=true;document.title=T("vg_h2")+" | Camões Conta";
      if(window.__VGOPEN)__VGOPEN();
      if(id==="vgfim"){var fm=document.getElementById("vgfim");if(fm){fm.scrollIntoView();try{fm.focus({preventScroll:true})}catch(_){}}}
      else if(keepScroll!==true)scrollTo(0,0);
      return;
    }
    if(e){
      var o=out(e);view.innerHTML=o?pageOut(e):pageSoon(e);if(o)bindFlip();homeEl.hidden=true;view.hidden=false;
      document.title=tx(e).t+" | Camões Conta";if(keepScroll!==true)scrollTo(0,0);
      if(!o){tick(e);timer=setInterval(function(){tick(e)},1000)}
      if(keepScroll!==true){try{view.focus({preventScroll:true})}catch(_){}}
    }else{
      view.hidden=true;homeEl.hidden=false;document.title="Camões Conta";
      if(keepScroll!==true&&id&&document.getElementById(id))document.getElementById(id).scrollIntoView();
    }
  }

  window.__CC={EPS:EPS,COV:COV,T:T,tx:tx,out:out,placeLine:placeLine,dshort:dshort,when:when,lang:function(){return lang}};
  langUI();
  lang=initialLang();
  applyStatic();
  addEventListener("hashchange",function(){route()});route();
  /* a estreia aparece sozinha quando chega a hora */
  setInterval(function(){var nx=nextUp();if(nx&&Date.now()>=Date.parse(nx.date)){home();if(window.__CC&&__CC.onRefresh)__CC.onRefresh()}},30000);

})();
</script>
<script>
(function(){
  var R=document.documentElement,sec=document.getElementById("viagem");
  function fb(){
    R.classList.remove("vg");
    Array.prototype.forEach.call(document.querySelectorAll('a[href="#viagem"]'),function(a){a.hidden=true});
    if(sec)sec.hidden=true;
    document.body.classList.remove("viagem-on");
    if(location.hash==="#viagem")location.replace("#");
  }
  var sk=document.querySelector(".skiplnk");
  if(sk)sk.addEventListener("click",function(e){e.preventDefault();var m=document.getElementById("ep").hidden?document.getElementById("home"):document.getElementById("ep");m.focus();m.scrollIntoView()});
  if(matchMedia("(prefers-reduced-motion:reduce)").matches){var ps=function(){Array.prototype.forEach.call(document.querySelectorAll("svg"),function(v){if(v.pauseAnimations)v.pauseAnimations()})};addEventListener("load",ps);addEventListener("hashchange",function(){setTimeout(ps,300)});setTimeout(ps,1500)}
  if(!R.classList.contains("vg")||!sec)return fb();
  var go=false,inst=null;
  function load(){
    if(go)return;go=true;
    import("./assets/viagem/viagem.js?v=11b").then(function(m){return m.initViagem(sec,window.__CC)})
      .then(function(i){inst=i})
      .catch(function(e){console.warn("viagem",e);fb()});
  }
  window.__VGOPEN=function(){load();if(inst&&inst.measure)setTimeout(inst.measure,0)};
  var pf=document.querySelector('a[href="#viagem"]');
  if(pf)pf.addEventListener("pointerenter",load,{once:true});
  if(location.hash==="#viagem")load();
})();
</script>

<script>
(function(){
  var rm=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  function wire(id){
    var v=document.getElementById(id); if(!v||rm)return;
    v.addEventListener("playing",function(){v.classList.add("on")});
    if("IntersectionObserver" in window){
      new IntersectionObserver(function(es){es.forEach(function(e){
        if(e.isIntersecting){var p=v.play();if(p&&p.catch)p.catch(function(){})}else v.pause()})},{threshold:.25}).observe(v);
    }else{var p=v.play();if(p&&p.catch)p.catch(function(){})}
  }
  wire("vhero");wire("vfoot");
})();
</script>
<script>
/* pergaminho das Fontes: desenrola conforme se faz scroll (aberto sem JS ou com movimento reduzido) */
(function(){
  var el=document.getElementById("fscroll"),sb=el&&el.parentNode;
  if(!el||(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches))return;
  var root=document.documentElement,fb=el.querySelector(".fbody"),kids=[].slice.call(fb.children),full=0,tick=false;
  function measure(){root.classList.remove("unroll");sb.style.minHeight="";fb.style.height="";full=fb.scrollHeight;sb.style.minHeight=sb.offsetHeight+"px";root.classList.add("unroll");update()}
  function update(){
    tick=false;
    var vh=innerHeight,r=sb.getBoundingClientRect(),start=vh*.8,range=Math.min(full*.85,vh*.75);
    var p=Math.max(0,Math.min(1,(start-r.top)/range));
    fb.style.height=Math.round(p*full)+"px";
    kids.forEach(function(k){k.classList.toggle("on",k.offsetTop+k.offsetHeight*.5<p*full)});
    el.classList.toggle("open",p>.97);
  }
  function req(){if(!tick){tick=true;requestAnimationFrame(update)}}
  measure();
  addEventListener("scroll",req,{passive:true});
  addEventListener("resize",function(){measure()});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(measure);
  addEventListener("load",measure);
})();
</script>
