<style>
@font-face{font-family:"IM Fell English";font-style:normal;font-weight:400;font-display:swap;src:url(assets/fonts/IMFellEnglish-normal-400.woff2) format("woff2")}
@font-face{font-family:"IM Fell English";font-style:italic;font-weight:400;font-display:swap;src:url(assets/fonts/IMFellEnglish-italic-400.woff2) format("woff2")}
@font-face{font-family:"Crimson Pro";font-style:normal;font-weight:400;font-display:swap;src:url(assets/fonts/CrimsonPro-normal-400.woff2) format("woff2")}
@font-face{font-family:"Crimson Pro";font-style:italic;font-weight:400;font-display:swap;src:url(assets/fonts/CrimsonPro-italic-400.woff2) format("woff2")}
@font-face{font-family:"Crimson Pro";font-style:normal;font-weight:600;font-display:swap;src:url(assets/fonts/CrimsonPro-normal-600.woff2) format("woff2")}
/* v2 "livro de lendas": tinta, papel e ouro liso. Sem degradés, brilhos, partículas nem cartões iguais. */
:root{
  --tinta:#0b2230; --tinta2:#10303f; --regua:#2a5368;
  --papel:#eadfc2; --papel-tinta:#12303d; --cobre:#8b5a2b;
  --ouro:#d6ab4f; --ouro-esc:#b88a32;
  --texto:#e9e2cf; --suave:#a7bac3;
  --serif-d:"IM Fell English","Iowan Old Style",Georgia,serif;
  --serif:"Crimson Pro","Iowan Old Style",Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--tinta);color:var(--texto);font-family:var(--serif);font-size:19px;line-height:1.6;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
a{color:var(--ouro)}
a:focus-visible,button:focus-visible{outline:2px solid var(--ouro);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3{font-family:var(--serif-d);font-weight:400;line-height:1.08;margin:0;text-wrap:balance;color:var(--texto)}
button{font-family:inherit}
[hidden]{display:none!important}

/* topo */
nav{display:flex;gap:16px 28px;flex-wrap:wrap;padding:22px 0;align-items:center;justify-content:space-between}
nav .brand{display:inline-flex;align-items:center;gap:12px;font-family:var(--serif-d);font-size:25px;color:var(--texto);text-decoration:none}
.bm{height:42px;width:auto;display:block}
.navr{display:flex;gap:6px 26px;flex-wrap:wrap;align-items:center}
nav a.l{color:var(--suave);text-decoration:none;font-size:18px}
nav a.l:hover{color:var(--texto);text-decoration:underline;text-underline-offset:5px}
.lang{display:flex;gap:2px;font-size:17px}
.lbtn{all:unset;box-sizing:border-box;cursor:pointer;padding:2px 7px;color:var(--suave);border-bottom:2px solid transparent}
.lbtn:hover{color:var(--texto)}
.lbtn[aria-pressed="true"]{color:var(--ouro);border-bottom-color:var(--ouro)}
.lbtn:focus-visible{outline:2px solid var(--ouro);outline-offset:2px}

/* abertura */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:40px 72px;align-items:end;padding:36px 0 88px}
.hero h1{font-size:clamp(46px,7.4vw,92px);line-height:1.02;margin:0 0 26px;max-width:11.5em}
.hero p{max-width:34em;margin:0 0 30px;color:var(--texto);font-size:21px;line-height:1.55}
.hnote{margin:18px 0 0;font-size:16px;color:var(--suave)}
.plate{margin:0;justify-self:end;width:100%;max-width:340px}
.portrait{aspect-ratio:9/13;border-radius:170px 170px 0 0;overflow:hidden;border:1px solid var(--ouro)}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;display:block}
.plate figcaption{margin-top:12px;font-style:italic;font-size:16px;color:var(--suave);text-align:left;border-top:1px solid var(--regua);padding-top:8px}

/* botões */
.btn{display:inline-block;background:var(--ouro);color:#1a1405;font-weight:600;font-size:18px;padding:11px 22px;border-radius:2px;text-decoration:none;border:1px solid var(--ouro)}
.btn:hover{background:#e4bd69}
.btn.ghost{background:transparent;color:var(--ouro);border-color:var(--ouro-esc);margin-left:8px}
.btn.ghost:hover{background:rgba(214,171,79,.12)}

/* secções: título à esquerda, conteúdo à direita */
section{display:grid;grid-template-columns:minmax(0,290px) minmax(0,1fr);gap:20px 64px;padding:76px 0;border-top:1px solid var(--regua)}
.shead h2{font-size:clamp(34px,4.4vw,48px);margin:0 0 14px}
.lede{color:var(--suave);margin:0;font-size:18px;max-width:30em}
.sbody{min-width:0}
.sub3{font-family:var(--serif-d);font-size:28px;margin:54px 0 4px;font-weight:400}

/* índice de episódios */
.eps{display:block;border-top:1px solid var(--regua)}
.ep{display:grid;grid-template-columns:48px 68px minmax(0,1fr);gap:0 20px;align-items:start;padding:22px 0;border-bottom:1px solid var(--regua);cursor:pointer}
.ep .num,.upc .num{font-family:var(--serif-d);font-style:italic;font-size:30px;line-height:1.1;color:var(--ouro)}
.ep img{width:68px;aspect-ratio:9/16;object-fit:cover;display:block;border:1px solid var(--ouro-esc)}
.ep .body{min-width:0}
.row1{display:flex;align-items:baseline;gap:0}
.ep h3{font-size:clamp(24px,3vw,32px)}
.cl{color:inherit;text-decoration:none}
.ep:hover h3 .cl{color:var(--ouro)}
.lead{flex:1 1 24px;min-width:24px;border-bottom:2px dotted var(--regua);margin:0 12px;transform:translateY(-5px)}
.where{font-style:italic;color:var(--suave);font-size:18px;white-space:nowrap}
.ep.is-next .where{color:var(--ouro)}
.ep p{margin:6px 0 8px;color:var(--texto);font-size:19px;max-width:34em}
.more{font-size:17px;text-decoration:underline;text-underline-offset:4px}
.ep.is-next img{filter:grayscale(.55) brightness(.85)}
.upgrid{display:block;border-top:1px solid var(--regua)}
.upc{display:flex;align-items:baseline;gap:0;padding:16px 0;border-bottom:1px solid var(--regua);text-decoration:none;color:var(--suave)}
.upc .num{width:68px;flex:none}
.upc b{font-family:var(--serif-d);font-weight:400;font-size:24px;color:var(--texto)}
.upc small{font-style:italic;font-size:17px;white-space:nowrap}
.upc:hover b{color:var(--ouro)}

/* mapa: carta em papel */
.filters{display:flex;flex-wrap:wrap;gap:2px 20px;margin:0 0 26px}
.fbtn{all:unset;box-sizing:border-box;cursor:pointer;font-size:18px;color:var(--suave);padding:2px 0;border-bottom:2px solid transparent}
.fbtn:hover{color:var(--texto)}
.fbtn[aria-pressed="true"]{color:var(--ouro);border-bottom-color:var(--ouro)}
.fbtn:focus-visible{outline:2px solid var(--ouro);outline-offset:2px}
.fsep{width:1px;background:var(--regua)}
.mapgrid{display:grid;grid-template-columns:minmax(0,310px) minmax(0,1fr);gap:36px;align-items:start}
.mapcol{display:grid;gap:18px;min-width:0}
.map{position:relative;width:100%;max-width:310px;background:var(--papel);padding:14px}
.map::before{content:"";position:absolute;inset:7px;border:1px solid rgba(18,48,61,.45);pointer-events:none}
.map svg{width:100%;height:auto;display:block}
.land{fill:rgba(18,48,61,.07);stroke:var(--papel-tinta);stroke-width:1.5;stroke-linejoin:round}
.pin{cursor:pointer}
.pin circle.d{fill:var(--papel-tinta)}
.pin.soon circle.d{fill:var(--papel);stroke:var(--papel-tinta);stroke-width:2}
.pin circle.h{fill:var(--papel-tinta);opacity:.12}
.pin.sel circle.h{opacity:.3}
.pin text{font-family:var(--serif);font-style:italic;font-size:14px;fill:var(--papel-tinta);paint-order:stroke;stroke:var(--papel);stroke-width:3px}
.pin.sel text{fill:var(--cobre);font-weight:600}
.pin .ring{fill:none;stroke:var(--cobre);stroke-width:1.2;opacity:0}
.pin.sel .ring{animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{r:6;opacity:.9}100%{r:20;opacity:0}}
.leader{stroke:var(--cobre);stroke-width:.9;opacity:.8}
.pin[hidden],.list li[hidden]{display:none}
.mcard{border-top:1px solid var(--regua);padding-top:14px;min-height:112px}
.mcard h3{font-size:24px;margin:2px 0 6px}
.mcard p{margin:0 0 12px;color:var(--suave);font-size:17px}
.mcard .btn{padding:8px 16px;font-size:17px}
.tag{font-style:italic;font-size:17px;color:var(--ouro)}
.tag.soon{color:var(--suave)}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--regua)}
.list button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:1fr auto;gap:2px 14px;padding:14px 0 14px 14px;border-bottom:1px solid var(--regua);cursor:pointer;border-left:3px solid transparent}
.list button:hover strong{color:var(--ouro)}
.list button.sel{border-left-color:var(--ouro)}
.list button:focus-visible{outline:2px solid var(--ouro);outline-offset:-2px}
.list strong{font-family:var(--serif-d);font-weight:400;font-size:22px}
.list span.w{grid-column:1/-1;color:var(--suave);font-size:17px}
.list .tag{font-size:16px}
.scroll{max-height:470px;overflow-y:auto;scrollbar-color:var(--ouro-esc) transparent;scrollbar-width:thin}

/* estreia: selo e contagem */

/* player com flip */
.cover.flipc{perspective:1400px;transition:transform .5s,max-width .5s}
.cover.flipc.on{transform:rotate(0);max-width:340px}
.flip{position:relative;width:100%;aspect-ratio:520/924;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.flipc.on .flip{transform:rotateY(180deg)}

.cover .face img{width:100%;height:100%;object-fit:cover;border:0;box-shadow:none}

.face.back iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.playbtn{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);display:inline-flex;align-items:center;gap:8px;padding:10px 22px;border:1px solid var(--ouro);background:rgba(8,26,36,.88);color:#f6ecd0;font-family:var(--serif);font-weight:600;font-size:19px;line-height:1;cursor:pointer;white-space:nowrap}

.flipc.on .backbtn{opacity:1;pointer-events:auto;transition-delay:.6s}
.cover.flipc::before{pointer-events:none}
.cover.flipc.on::before{opacity:0}

.teste-tag{position:fixed;top:0;left:0;right:0;z-index:9999;background:#b3261e;color:#fff;text-align:center;font:700 12px/1 system-ui,sans-serif;letter-spacing:.12em;padding:6px 8px}

     s:[["A história","<p>Numa noite escura, um condutor vê uma rapariga vestida de branco à beira da estrada. Ela pede boleia e entra no carro. Segue calada, com o olhar fixo no caminho. A meio da viagem, o condutor olha para trás e o banco está vazio.</p><p>É assim que a lenda costuma ser contada em Portugal, com pequenas diferenças de pessoa para pessoa. Há quem fale de uma curva perigosa, de um acidente antigo ou de um aviso deixado à beira da estrada. Cada versão acrescenta ou muda o seu pormenor.</p>"],
      ["De onde vem","<p>A história de Teresa Fidalgo circulou muito antes de chegar às redes sociais, passada de boca em boca. É uma lenda urbana, ou seja, uma história que se conta como se fosse verdadeira mas não tem um caso comprovado por trás.</p><p>A curta-metragem <i>A Curva</i>, do realizador David Rebordão, adaptou o mito e deu-lhe uma nova vida no cinema e na internet. O mito existia já antes do filme. O filme não o inventou.</p>"],
      ["O que sabemos e o que não sabemos","<ul><li>Não há registo histórico de uma Teresa Fidalgo real ligada a este episódio.</li><li>O local muda conforme quem conta. Sintra e arredores aparecem em várias versões, mas não está confirmado.</li><li>A história tem parentes em muitos países: a boleia dada a uma passageira que desaparece é um tema muito antigo das lendas urbanas.</li></ul>"]],
     q2:"Paravas para dar boleia? Sim ou não?",
     src:["Curta-metragem <i>A Curva</i> (David Rebordão) e entrevista ao realizador na Fábrica do Terror.","Tradição oral portuguesa."]},
    en:{t:"The Legend of Teresa Fidalgo",place:"Sintra",line:"The girl in white who asks for a lift at night and vanishes from the back seat.",sub:"The girl in white who asks for a lift at night and vanishes from the back seat.",chips:["Urban legend","Oral tradition","Sintra and surroundings"],
     s:[["The story","<p>On a dark night, a driver sees a girl dressed in white at the side of the road. She asks for a lift and gets in. She rides in silence, eyes fixed on the road. Halfway through the journey, the driver looks back and the seat is empty.</p><p>That is how the legend is usually told in Portugal, with small differences from person to person. Some speak of a dangerous bend, an old accident or a warning left at the roadside. Each version adds or changes a detail.</p>"],
      ["Where it comes from","<p>The story of Teresa Fidalgo circulated long before reaching social media, passed from mouth to mouth. It is an urban legend, meaning a story told as if it were true but with no proven case behind it.</p><p>The short film <i>A Curva</i>, by director David Rebordão, adapted the myth and gave it new life in cinema and online. The myth already existed before the film. The film did not invent it.</p>"],
      ["What we know and what we don't","<ul><li>There is no historical record of a real Teresa Fidalgo tied to this episode.</li><li>The place changes with whoever tells it. Sintra and its surroundings appear in several versions, but this is not confirmed.</li><li>The story has relatives in many countries: a lift given to a passenger who vanishes is a very old theme of urban legends.</li></ul>"]],
     q2:"Would you stop to give a lift? Yes or no?",
     src:["Short film <i>A Curva</i> (David Rebordão) and the interview with the director on Fábrica do Terror.","Portuguese oral tradition."]}

   ep2:{
    pt:{t:"A Lenda da Dama Pé de Cabra",place:"",teaser:"Uma dama, um rochedo e uma condição.",line:"A dama do rochedo, o fidalgo que casou com ela e a condição que ele não devia quebrar.",sub:"A dama do rochedo, o fidalgo que casou com ela e a condição que ele não devia quebrar.",chips:["Lenda medieval","Livro de Linhagens","Herculano"],
     s:[["A história","<p>Um nobre encontra uma dama de grande beleza, sentada sozinha num rochedo. Apaixona-se e pede-a em casamento. Ela aceita, com uma condição que ele tem de cumprir para sempre.</p><p>Vivem juntos durante algum tempo, mas há um segredo: a dama tem um pé de cabra. Um dia, a condição é quebrada e a dama desaparece, deixando o marido a perceber que nunca soube quem ela era realmente.</p><p>Os pormenores, como o nome do nobre, o lugar e o que acontece aos filhos, mudam de versão para versão.</p>"],
      ["De onde vem","<p>A lenda aparece escrita no <i>Livro de Linhagens</i> do Conde D. Pedro Afonso, compilado por volta de 1340. É um livro de genealogias da nobreza medieval, e esta história surge ligada à origem de uma família.</p><p>No século XIX, Alexandre Herculano recontou-a em <i>Lendas e Narrativas</i>, e foi por essa versão que muita gente a conheceu. É uma das lendas escritas mais antigas da Península Ibérica.</p>"],
      ["O que sabemos e o que não sabemos","<ul><li>A lenda é medieval e tem versão escrita. Isso não a torna um facto histórico.</li><li>A ideia de uma mulher sobrenatural que casa com um mortal e desaparece quando uma regra é quebrada existe em muitas culturas europeias.</li><li>Quem a conta hoje junta ou tira pormenores. Aqui seguimos o essencial das fontes escritas.</li></ul>"]],
     q2:"Confiavas na dama do rochedo? Sim ou não?",
     src:["<i>Livro de Linhagens do Conde D. Pedro</i> (Pedro Afonso), c. 1340.","Alexandre Herculano, <i>Lendas e Narrativas</i>."]},
    en:{t:"The Legend of the Goat-Foot Lady",place:"",teaser:"A lady, a rock and a condition.",line:"The lady of the rock, the nobleman who married her and the condition he must not break.",sub:"The lady of the rock, the nobleman who married her and the condition he must not break.",chips:["Medieval legend","Book of Lineages","Herculano"],
     s:[["The story","<p>A nobleman finds a woman of great beauty sitting alone on a rock. He falls in love and asks for her hand. She accepts, with one condition he must keep forever.</p><p>They live together for a while, but there is a secret: the lady has a goat's foot. One day the condition is broken and the lady disappears, leaving her husband to realise he never knew who she really was.</p><p>The details, such as the nobleman's name, the place and what happens to the children, change from version to version.</p>"],
      ["Where it comes from","<p>The legend is written down in the <i>Livro de Linhagens</i> (Book of Lineages) of Count Pedro Afonso, compiled around 1340. It is a book of medieval noble genealogies, and this story is tied to the origin of a family.</p><p>In the 19th century, Alexandre Herculano retold it in <i>Lendas e Narrativas</i>, and that is the version many people know. It is one of the oldest written legends of the Iberian Peninsula.</p>"],
