<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Camões Conta</title>
<meta name="description" content="Camões Conta: lendas e mistérios de Portugal em vídeo curto, com fontes e mapa das histórias. Legends of Portugal in short videos.">
<meta name="theme-color" content="#0b2230">
<meta property="og:title" content="Camões Conta">
<meta property="og:description" content="Lendas e mistérios de Portugal contados por Luís de Camões.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b2230'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='40' font-weight='700' text-anchor='middle' fill='%23f0c878'%3EC%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: coluna única editorial; hero com Camões à direita, episódios como fichas verticais, mapa de Portugal com marcadores */
:root{
  --bg:#0b2230; --bg2:#102c3d; --card:#133548; --line:#24506a;
  --ink:#f3ead6; --muted:#a9bcc6; --gold:#f0c878; --gold2:#c99a3e; --ink-on-gold:#1a1405;
  --display:"Playfair Display",Georgia,serif; --body:"Inter",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
a{color:var(--gold)}
a:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.12;margin:0;text-wrap:balance}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:600}
nav{display:flex;gap:20px;flex-wrap:wrap;padding:18px 0;font-size:14px;align-items:center;justify-content:space-between}
nav .brand{font-family:var(--display);font-weight:800;color:var(--gold);font-size:18px;text-decoration:none}
nav div{display:flex;gap:18px;flex-wrap:wrap}
nav a.l{color:var(--muted);text-decoration:none}
nav a.l:hover{color:var(--ink)}
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:32px;align-items:center;padding:28px 0 56px}
.hero h1{font-size:clamp(40px,7vw,76px);margin:14px 0 18px}
.hero h1 em{color:var(--gold);font-style:italic;font-weight:600}
.hero p{color:var(--muted);max-width:46ch;margin:0 0 24px;font-size:17px}
.btn{display:inline-block;background:var(--gold);color:var(--ink-on-gold);font-weight:600;padding:12px 20px;border-radius:4px;text-decoration:none;font-size:15px}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold2);margin-left:8px}
.portrait{justify-self:center;width:100%;max-width:330px;aspect-ratio:9/14;border-radius:160px 160px 8px 8px;overflow:hidden;border:2px solid var(--gold2);box-shadow:0 0 0 8px var(--bg2)}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block}
section{padding:48px 0;border-top:1px solid var(--line)}
section>h2{font-size:clamp(28px,4vw,40px);margin:8px 0 10px}
.lede{color:var(--muted);max-width:60ch;margin:0 0 30px}
.eps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:24px}
.ep{display:grid;grid-template-columns:150px 1fr;gap:20px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px}
.ep img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:4px;display:block}
.ep .body{min-width:0}
.ep h3{font-size:22px;margin:4px 0 8px}
.ep p{margin:0 0 12px;color:var(--muted);font-size:15px}
.src{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
.src b{color:var(--ink);font-weight:600}
.tag{display:inline-block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;padding:3px 8px;border-radius:3px}
.tag.on{background:var(--gold);color:var(--ink-on-gold)}
.tag.soon{border:1px solid var(--line);color:var(--muted)}
.mapgrid{display:grid;grid-template-columns:minmax(0,300px) 1fr;gap:36px;align-items:start}
.map{width:100%;max-width:300px;justify-self:center}
.map svg{width:100%;height:auto;display:block}
.land{fill:var(--bg2);stroke:var(--gold2);stroke-width:1.4}
.pin{cursor:pointer}
.pin circle.d{fill:var(--gold)}
.pin.soon circle.d{fill:var(--bg);stroke:var(--gold);stroke-width:2}
.pin circle.h{fill:var(--gold);opacity:.15}
.pin.sel circle.h{opacity:.45}
.pin text{font-family:var(--body);font-size:10px;fill:var(--ink)}
.list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.list button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:6px;cursor:pointer}
.list button:focus-visible{outline:2px solid var(--gold)}
.list button.sel{border-color:var(--gold)}
.list strong{font-family:var(--display);font-size:18px}
.list span.w{grid-column:1/-1;color:var(--muted);font-size:14px}
.note{font-size:13px;color:var(--muted);margin-top:14px}
.fontes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px}
.fontes div{border-left:2px solid var(--gold2);padding-left:16px}
.fontes h3{font-size:19px;margin-bottom:6px}
.fontes p{margin:0;color:var(--muted);font-size:15px}
.rules{margin:0;padding-left:18px;color:var(--muted);max-width:62ch}
.rules li{margin-bottom:8px}
footer{border-top:1px solid var(--line);padding:32px 0 48px;color:var(--muted);font-size:14px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer .q{font-family:var(--display);font-style:italic;color:var(--gold);font-size:18px}
@media(max-width:760px){.hero{grid-template-columns:1fr}.portrait{order:-1;max-width:240px}.mapgrid{grid-template-columns:1fr}.ep{grid-template-columns:110px 1fr}}
@media(prefers-reduced-motion:no-preference){.pin circle.h{transition:opacity .2s}}

/* ouro: gradiente reutilizável */
:root{--goldgrad:linear-gradient(100deg,#9c6f1f 0%,#f0c878 28%,#fff1c9 50%,#f0c878 72%,#b98524 100%)}
.gt{background:var(--goldgrad);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
nav .brand,.hero h1 em,section>h2,.footer-q{background:var(--goldgrad);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.hero h1 em{font-style:italic}
body{background:radial-gradient(1200px 500px at 80% -10%,#17425a 0%,transparent 60%),var(--bg)}
#gold{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1}
.portrait{position:relative;border:0;box-shadow:0 0 60px rgba(240,200,120,.28),0 0 0 2px var(--gold2),0 0 0 9px var(--bg2),0 0 0 10px var(--gold2)}
.portrait::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 40px rgba(240,200,120,.25);pointer-events:none}
.btn{background:var(--goldgrad);background-size:200% 100%;position:relative;overflow:hidden;box-shadow:0 6px 24px rgba(240,200,120,.28);transition:background-position .5s,transform .2s}
.btn:hover{background-position:100% 0;transform:translateY(-1px)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.ghost:hover{background:rgba(240,200,120,.12)}
section{border-top:0;position:relative}
section::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold2),transparent)}
section::after{content:"";position:absolute;top:-5px;left:50%;width:9px;height:9px;background:var(--gold);transform:translateX(-50%) rotate(45deg);box-shadow:0 0 12px rgba(240,200,120,.8)}
.ep,.list button,.fontes div{transition:border-color .25s,box-shadow .25s}
.ep{border-color:rgba(201,154,62,.45);background:linear-gradient(160deg,#16405a,#123246)}
.ep:hover{border-color:var(--gold);box-shadow:0 0 30px rgba(240,200,120,.18)}
.ep img{box-shadow:0 0 0 1px var(--gold2),0 8px 24px rgba(0,0,0,.4)}
.tag.on{background:var(--goldgrad)}
.list button{border-color:rgba(201,154,62,.35)}
.list button:hover{border-color:var(--gold)}
.list button.sel{border-color:var(--gold);box-shadow:0 0 24px rgba(240,200,120,.22)}
.fontes div{border-left:0;padding:18px 18px 18px 20px;background:var(--bg2);border-radius:6px;border:1px solid rgba(201,154,62,.3)}
.fontes h3{background:var(--goldgrad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;display:inline-block}
footer{border-top:1px solid rgba(201,154,62,.4)}
/* mapa */
.mapgrid{grid-template-columns:minmax(0,380px) 1fr}
.map{max-width:380px;background:radial-gradient(circle at 40% 50%,#12364b,#0b2230 70%);border:1px solid rgba(201,154,62,.45);border-radius:10px;padding:8px}
.land{fill:url(#landg);stroke:var(--gold);stroke-width:1.6;stroke-linejoin:round;filter:drop-shadow(0 0 6px rgba(240,200,120,.35))}
.pin text{font-size:12px;font-weight:500;paint-order:stroke;stroke:#0b2230;stroke-width:3px;fill:var(--ink)}
.pin.sel text{fill:var(--gold);font-weight:600}
.pin .ring{fill:none;stroke:var(--gold);stroke-width:1.2;opacity:0}
.pin.sel .ring{animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{r:6;opacity:.9}100%{r:20;opacity:0}}
.leader{stroke:var(--gold2);stroke-width:.8;opacity:.7}
@media(prefers-reduced-motion:reduce){.pin.sel .ring{animation:none;opacity:.6}#gold{display:none}}
@media(max-width:760px){.mapgrid{grid-template-columns:1fr}}

.cl{color:inherit;text-decoration:none}.cl:hover{color:var(--gold)}
.more{display:inline-block;margin-bottom:12px;font-weight:600;font-size:14px;text-decoration:none}
.more:hover{text-decoration:underline}
.ep{cursor:pointer}
/* página de episódio */
#ep{padding:12px 0 56px}
.back{display:inline-block;margin:8px 0 22px;color:var(--muted);text-decoration:none;font-size:14px}.back:hover{color:var(--gold)}
.ehero{display:grid;grid-template-columns:240px 1fr;gap:36px;align-items:center;padding-bottom:36px}
.ehero img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:6px;box-shadow:0 0 50px rgba(240,200,120,.25),0 0 0 2px var(--gold2)}
.ehero h1{font-size:clamp(32px,5.5vw,58px);margin:12px 0 14px}
.ehero .sub{color:var(--muted);font-size:18px;max-width:44ch;margin:0 0 22px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.chip{font-size:12px;letter-spacing:.08em;text-transform:uppercase;border:1px solid rgba(201,154,62,.5);color:var(--gold);padding:4px 10px;border-radius:3px}
.art{max-width:68ch;margin:0 auto}
.art section{padding:34px 0}
.art h2{font-size:clamp(24px,3.2vw,32px);margin:0 0 14px;background:var(--goldgrad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.art p{margin:0 0 16px;font-size:17px;line-height:1.75;color:#dcd6c6}
.art ul{margin:0 0 16px;padding-left:20px;color:#dcd6c6}.art li{margin-bottom:8px;line-height:1.7}
.callout{border:1px solid rgba(201,154,62,.5);background:linear-gradient(160deg,#16405a,#123246);border-radius:8px;padding:20px 22px;margin:8px 0 0}
.callout p{margin:0;font-style:italic;font-family:var(--display);font-size:22px;color:var(--gold);line-height:1.4}
.cta{text-align:center;padding:40px 16px;margin-top:16px;border:1px solid rgba(201,154,62,.5);border-radius:10px;background:radial-gradient(500px 200px at 50% 0%,rgba(240,200,120,.16),transparent),var(--bg2)}
.cta h2{margin-bottom:8px}.cta p{margin:0 0 22px}
.cta .btn{font-size:17px;padding:15px 28px}
.nextep{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:28px;font-size:15px}
@media(max-width:760px){.ehero{grid-template-columns:1fr;gap:22px}.ehero img{max-width:200px}}

/* banner largo na página de episódio */
.ebanner{position:relative;margin:0 0 34px;border-radius:10px;overflow:hidden;border:1px solid var(--gold2);box-shadow:0 0 0 6px var(--bg2),0 0 0 7px rgba(201,154,62,.6),0 20px 60px rgba(0,0,0,.45)}
.ebanner img{display:block;width:100%;aspect-ratio:16/7;object-fit:cover;object-position:50% 55%}
.ebanner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(11,34,48,.55));pointer-events:none}
.ehero{grid-template-columns:200px 1fr;gap:32px;align-items:start;padding:12px 0 30px}
.ehero img{max-width:200px}
.ehero h1{margin-top:8px}
.art h2{position:relative;padding-bottom:12px;margin-bottom:18px}
.art h2::after{content:"";position:absolute;left:0;bottom:0;width:84px;height:2px;background:linear-gradient(90deg,var(--gold),transparent)}
.cta h2::after{display:none}.cta h2{padding-bottom:0}.cta::before{content:"\25C6";display:block;color:var(--gold);font-size:26px;margin-bottom:6px;text-shadow:0 0 14px rgba(240,200,120,.6)}
.nextep{border-top:1px solid rgba(201,154,62,.3);padding-top:20px}
@media(max-width:760px){.ehero{grid-template-columns:1fr}.ebanner img{aspect-ratio:16/9}}

/* capa maior e na diagonal */
.ehero{grid-template-columns:minmax(0,340px) 1fr;gap:56px;align-items:center;padding:24px 0 48px}
.cover{position:relative;width:100%;max-width:320px;justify-self:center;transform:rotate(-6deg);transition:transform .4s}
.cover::before{content:"";position:absolute;inset:0;border:2px solid var(--gold2);border-radius:8px;transform:rotate(9deg) translate(10px,6px);opacity:.55}
.cover img{position:relative;max-width:none;width:100%;border-radius:8px;box-shadow:0 0 70px rgba(240,200,120,.32),0 24px 50px rgba(0,0,0,.55),0 0 0 2px var(--gold2)}
.ehero:hover .cover{transform:rotate(-3deg) scale(1.02)}
@media(max-width:760px){.ehero{grid-template-columns:1fr;gap:34px}.cover{max-width:250px}}
@media(prefers-reduced-motion:reduce){.cover{transition:none}}

/* v8: estreias, filtros, cartão do mapa */
.sub3{font-size:22px;margin:44px 0 6px;background:var(--goldgrad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;display:inline-block}
.upgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.upc{display:grid;grid-template-columns:60px 1fr;gap:14px;align-items:center;padding:14px;border:1px dashed rgba(201,154,62,.55);border-radius:8px;background:var(--bg2);text-decoration:none;color:inherit;transition:border-color .25s,box-shadow .25s}
.upc:hover{border-color:var(--gold);box-shadow:0 0 24px rgba(240,200,120,.16)}
.upc b{font-family:var(--display);font-size:17px;display:block;line-height:1.25}
.upc small{color:var(--muted);font-size:13px;display:block;margin-top:3px}
.seal{aspect-ratio:1;border-radius:50%;border:1px solid var(--gold2);display:grid;place-items:center;color:var(--gold);font-family:var(--display);font-weight:800;font-size:24px;background:radial-gradient(circle,#1a4560,#0b2230);box-shadow:0 0 18px rgba(240,200,120,.22),inset 0 0 0 3px #0b2230,inset 0 0 0 4px rgba(201,154,62,.5)}
.ep.is-next .tag{margin-right:6px}
.ep .when{display:block;color:var(--gold);font-size:14px;font-weight:600;margin:0 0 12px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}
.fbtn{all:unset;box-sizing:border-box;cursor:pointer;font-size:13px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;padding:8px 14px;border:1px solid rgba(201,154,62,.5);border-radius:3px;color:var(--gold)}
.fbtn:hover{background:rgba(240,200,120,.1)}
.fbtn[aria-pressed="true"]{background:var(--goldgrad);color:var(--ink-on-gold);border-color:transparent}
.fbtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.fsep{width:1px;background:var(--line);margin:0 4px}
.mapcol{display:grid;gap:14px;justify-items:center;min-width:0}
.mcard{width:100%;max-width:380px;border:1px solid rgba(201,154,62,.55);border-radius:8px;padding:16px 18px;background:linear-gradient(160deg,#16405a,#123246);min-height:118px}
.mcard h3{font-size:20px;margin:8px 0 6px}
.mcard p{margin:0 0 12px;color:var(--muted);font-size:14px}
.mcard .btn{padding:9px 16px;font-size:14px}
.scroll{max-height:470px;overflow-y:auto;padding:2px 6px 2px 2px;scrollbar-color:var(--gold2) transparent;scrollbar-width:thin}
.list li[hidden]{display:none}
.pin[hidden]{display:none}
.pin.soon circle.d{fill:var(--bg);stroke:var(--gold);stroke-width:2}
/* detalhe de estreia */
.sealcard{position:relative;aspect-ratio:9/16;display:grid;align-content:center;justify-items:center;gap:10px;text-align:center;border-radius:8px;border:2px solid var(--gold2);background:radial-gradient(circle at 50% 38%,#1d4d68,#0b2230 72%);box-shadow:0 0 70px rgba(240,200,120,.3),0 24px 50px rgba(0,0,0,.55);color:var(--gold)}
.sealcard::before{content:"";position:absolute;inset:10px;border:1px solid rgba(201,154,62,.55);border-radius:4px}
.sealcard .k{font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:600}
.sealcard .nn{font-family:var(--display);font-weight:800;font-size:clamp(88px,16vw,132px);line-height:1;text-shadow:0 0 30px rgba(240,200,120,.6);background:var(--goldgrad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.sealcard .s{font-family:var(--display);font-style:italic;font-size:18px;color:var(--ink)}
.count{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 24px}
.count div{min-width:74px;text-align:center;padding:10px 8px;border:1px solid rgba(201,154,62,.55);border-radius:6px;background:var(--bg2)}
.count b{display:block;font-family:var(--display);font-size:30px;line-height:1.1;color:var(--gold)}
.count span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.datebig{font-family:var(--display);font-size:clamp(20px,3vw,26px);margin:0 0 16px;color:var(--ink)}
.datebig em{color:var(--gold)}

.navr{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.lang{display:flex;border:1px solid rgba(201,154,62,.55);border-radius:4px;overflow:hidden}
.lbtn{all:unset;box-sizing:border-box;cursor:pointer;font-size:12px;letter-spacing:.1em;font-weight:600;padding:5px 10px;color:var(--gold)}
.lbtn:hover{background:rgba(240,200,120,.12)}
.lbtn[aria-pressed="true"]{background:var(--goldgrad);color:var(--ink-on-gold)}
.lbtn:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.hnote{margin:16px 0 0;font-size:13px;color:var(--muted)}
[hidden]{display:none!important}
</style>

</head>
<body>
<canvas id="gold" aria-hidden="true"></canvas>
<div class="wrap">
<nav><a class="brand" href="#">Camões Conta</a><div class="navr"><a class="l" href="#episodios" data-i18n="nav_eps"></a><a class="l" href="#mapa" data-i18n="nav_map"></a><a class="l" href="#fontes" data-i18n="nav_src"></a><div class="lang" id="langsel" role="group" data-i18n-aria="lang_label"></div></div></nav>

<div id="home">
<header class="hero" id="topo">
  <div>
    <span class="eyebrow" data-i18n="hero_eyebrow"></span>
    <h1 data-i18n-html="hero_h1"></h1>
    <p data-i18n="hero_p"></p>
    <a class="btn" href="https://www.youtube.com/@Cam%C3%B5esConta" target="_blank" rel="noopener" data-i18n="btn_yt"></a><a class="btn ghost" href="#episodios" data-i18n="btn_eps"></a>

    var first=null;
    EPS.forEach(function(x){var v=vis(x);items[x.id].li.hidden=!v;if(pins[x.id])pins[x.id].toggleAttribute("hidden",!v);if(v&&!first)first=x.id});
    if(!cur||!vis(BY[cur]))sel(first||"ep1");else sel(cur);
    Array.prototype.forEach.call(fbox.querySelectorAll(".fbtn"),function(b){b.setAttribute("aria-pressed",String(F[b.dataset.k]===b.dataset.v))});
  }
  var fbound=false;
  function filters(){
    fbox.hidden=EPS.length<5;
    var regs=[];EPS.forEach(function(x){if(x.region&&regs.indexOf(x.region)<0)regs.push(x.region)});
    var h="";[["st","all","f_all"],["st","pub","f_pub"],["st","soon","f_soon"]].forEach(function(f){h+='<button type="button" class="fbtn" data-k="'+f[0]+'" data-v="'+f[1]+'">'+T(f[2])+'</button>'});
    if(regs.length>1){h+='<span class="fsep" aria-hidden="true"></span><button type="button" class="fbtn" data-k="rg" data-v="all">'+T("f_country")+'</button>';regs.forEach(function(r){h+='<button type="button" class="fbtn" data-k="rg" data-v="'+r+'">'+T("reg_"+r)+'</button>'})}
    fbox.innerHTML=h;
    if(!fbound){fbound=true;fbox.addEventListener("click",function(ev){var b=ev.target.closest(".fbtn");if(!b)return;F[b.dataset.k]=b.dataset.v;applyFilter()})}
  }

  langUI();
  lang=initialLang();
  applyStatic();filters();
  addEventListener("hashchange",function(){route()});route();
  /* a estreia aparece sozinha quando chega a hora */
  setInterval(function(){var nx=nextUp();if(nx&&Date.now()>=Date.parse(nx.date)){home();buildMapState()}},30000);

  /* partículas douradas */
  var c=document.getElementById("gold");if(!c||matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  var x2=c.getContext("2d"),W,H,ps=[],N=46;
  function rs(){W=c.width=innerWidth;H=c.height=innerHeight}rs();addEventListener("resize",rs);
  for(var j=0;j<N;j++)ps.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.8+.4,v:Math.random()*.25+.08,p:Math.random()*6.28,a:Math.random()*.5+.2});
  (function f(t){x2.clearRect(0,0,W,H);
    ps.forEach(function(p){p.y-=p.v;p.x+=Math.sin(t/1800+p.p)*.25;if(p.y<-5){p.y=H+5;p.x=Math.random()*W}
      var a=p.a*(.6+.4*Math.sin(t/700+p.p));x2.beginPath();x2.fillStyle="rgba(240,200,120,"+a+")";x2.shadowColor="rgba(240,200,120,.8)";x2.shadowBlur=8;x2.arc(p.x,p.y,p.r,0,6.28);x2.fill()});
    requestAnimationFrame(f)})(0);
})();
</script>
